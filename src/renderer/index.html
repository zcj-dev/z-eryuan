<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z 二次元 · 你的云端 API 套壳</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">Z</div>
      <div class="brand-name">Z 二次元</div>
    </div>

    <div class="did-box">
      <span class="did-label">DID</span>
      <span class="did-value" id="didValue">生成中...</span>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="chat">
        <span class="nav-icon">💬</span>
        <span class="nav-label">对话</span>
      </button>
      <button class="nav-item" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">设置</span>
      </button>
    </nav>

    <div class="api-status-sidebar" id="apiStatusSidebar">
      <span class="dot" id="statusDot"></span>
      <span class="dot-text" id="statusText">未配置</span>
    </div>

    <div class="sidebar-footer">
      Z 二次元 v1.0<br>云端 API 套壳
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="main">
    <header class="app-header">
      <h1 id="pageTitle">对话</h1>
      <div class="header-actions">
        <button class="btn-icon" id="btnClearChat" title="清空对话">🗑️</button>
      </div>
    </header>

    <!-- 对话页面 -->
    <section class="view active" id="view-chat">
      <div class="api-status-bar" id="apiStatusBar">
        <span class="dot" id="barDot"></span>
        <span id="barText">未配置 API</span>
      </div>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">👋</div>
        <h3>开始新对话</h3>
        <p>先在「设置」配置你的云端 API，再来这里提问。</p>
      </div>

      <div class="chat-container" id="chatContainer">
        <div id="messages"></div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="chatInput" rows="1" placeholder="输入问题...（Shift+Enter 换行，Enter 发送）"></textarea>
          <button class="btn-send" id="btnSend">发送</button>
        </div>
        <div class="input-hint">Shift+Enter 换行 · Enter 发送 · 数据仅存在本机</div>
      </div>
    </section>

    <!-- 设置页面 -->
    <section class="view" id="view-settings">
      <div class="settings-card">
        <h2>云端 API 配置</h2>
        <p class="settings-desc">接入你自己的云端算力端点，对话数据仅存在本机。</p>

        <div class="settings-grid">
          <div class="field">
            <label>Base URL <span class="required">*</span></label>
            <input type="text" id="inpBaseURL" placeholder="https://api.yourdomain.com/v1">
            <span class="hint">你的云端 API 端点，例如 https://api.example.com/v1</span>
          </div>

          <div class="field">
            <label>API Key</label>
            <input type="password" id="inpApiKey" placeholder="sk-...">
            <span class="hint">可留空，若你的端点不需要鉴权</span>
          </div>

          <div class="field">
            <label>Model <span class="required">*</span></label>
            <input type="text" id="inpModel" placeholder="deepseek-chat / llama-3 等">
            <span class="hint">你云端提供的模型名称</span>
          </div>
        </div>

        <div class="settings-actions">
          <button class="btn btn-primary" onclick="app.saveApiConfig()">保存配置</button>
          <button class="btn btn-outline" onclick="app.testApiConnection()">测试连接</button>
        </div>

        <div id="apiResult" class="result-box"></div>

        <div class="presets">
          <h3>快速预设</h3>
          <div class="preset-list">
            <label class="preset-item" onclick="app.setPreset('custom')">
              <input type="radio" name="preset" value="custom"> 自定义云端 API
            </label>
            <label class="preset-item" onclick="app.setPreset('litellm')">
              <input type="radio" name="preset" value="litellm"> LiteLLM 本地
            </label>
            <label class="preset-item" onclick="app.setPreset('ollama')">
              <input type="radio" name="preset" value="ollama"> Ollama 本地
            </label>
          </div>
          <div class="preset-hint">选择预设会自动填充 Base URL</div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="js/zml-core.js"></script>
<script src="js/zml-settings.js"></script>
<script src="js/zml-chat.js"></script>
<script src="js/zml-app.js"></script>
</body>
</html>
